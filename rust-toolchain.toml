# The toolchain the firmware and its host crates are built and tested
# with, for reproducible firmware builds.  Targets: Pico (RP2040) and
# Pico 2 (RP2350, Arm cores).
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy", "llvm-tools"]
targets = ["thumbv6m-none-eabi", "thumbv8m.main-none-eabihf"]
