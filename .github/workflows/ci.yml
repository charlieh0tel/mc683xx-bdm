# The Rust tests and `make lint`, as AGENTS.md has them run before each
# commit.  The commit-message and identity checks are ee-tooling.yml's.  The toolchain and its targets come
# from firmware/rust-toolchain.toml.  The Rust steps are skipped until
# firmware/ has a workspace.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
      - name: Toolchain
        if: hashFiles('firmware/Cargo.toml') != ''
        working-directory: firmware
        run: rustup toolchain install
      - name: Tests
        if: hashFiles('firmware/Cargo.toml') != ''
        working-directory: firmware
        run: cargo test
      - name: Lint
        run: make lint
