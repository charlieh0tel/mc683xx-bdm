# The Rust tests and `make lint`, as AGENTS.md has them run before each
# commit, and every firmware build linked (`make size`), against the
# committed Cargo.lock and uv.lock files (--locked, and the Makefile's
# UV_LOCKED).  The commit-message and identity checks are
# ee-tooling.yml's.  The toolchain and its targets come from
# rust-toolchain.toml, at the root, for the host workspace and
# firmware/pod-fw alike.  The `bdm` job builds `bdm` on macOS and
# Windows.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Toolchain
        run: rustup toolchain install
      - name: Tests
        run: cargo test --locked
      - name: Lint
        run: make lint
      # Links what clippy only checks: a FLASH or RAM overflow or a
      # linker-script break fails here.  The sizes go to the run's
      # summary.  Not `make deb`: release.yml builds the package.
      - name: Firmware
        shell: bash
        run: |
          make size > "$RUNNER_TEMP/size.txt"
          cat "$RUNNER_TEMP/size.txt"
          { echo '### Firmware sizes (bytes)'; echo '```'; cat "$RUNNER_TEMP/size.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  bdm:
    # `bdm` (crates/host) on the other hosts it is meant to run on.
    # macOS has Unix sockets, so its tests run there, against the
    # stand-in; Windows has none (`--pod unix:PATH` is Unix's, and the
    # tests use Unix sockets), so there it is only built.  The compiler
    # is the one rust-toolchain.toml names, which rustup, already on
    # the runner, installs on the first cargo call.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, test: true }
          - { os: windows-latest, test: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: cargo build --locked -p mc683xx-bdm --bin bdm
      - name: Tests
        if: matrix.test
        run: cargo test --locked -p mc683xx-bdm
