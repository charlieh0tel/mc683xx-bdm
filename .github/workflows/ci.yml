# The Rust tests and `make lint`, as AGENTS.md has them run before each
# commit, against the committed Cargo.lock and uv.lock files (--locked,
# and the Makefile's UV_LOCKED).  The commit-message and identity checks
# are ee-tooling.yml's.  The toolchain and its targets come from
# rust-toolchain.toml, at the root, for the host workspace and
# firmware/pod-fw alike.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
      - name: Toolchain
        run: rustup toolchain install
      - name: Tests
        run: cargo test --locked
      - name: Lint
        run: make lint
