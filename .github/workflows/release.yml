# A release (RELEASING.md).  The mc683xx-bdm Debian package, amd64 and
# arm64, through deb-workflows' rust-build-deb, with the pod's UF2 it
# ships built first; the Python package's wheels and sdist; and the
# published crates packaged and built from their packages alone.  A v*
# tag, once the `gate` job has passed, publishes a GitHub Release of
# the Debian packages and the UF2, the wheels and sdist to PyPI and the
# crates to crates.io (their first release by hand).  A push to main
# builds and tests the same and publishes nothing (rust-build-deb
# releases only on a tag), and main's runs keep the cargo cache warm
# for the tag's; a pull request does too, but builds Linux's wheels
# only.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions: {}

env:
  # The bindings' crate; its pyproject.toml sets the features (abi3
  # from Python 3.10).
  PYTHON_MANIFEST: crates/py/Cargo.toml
  # maturin as mc683xx's release pins it; pytest as crates/py/uv.lock.
  MATURIN_VERSION: "1.15.0"
  PYTEST_VERSION: "9.2.0"
  # The oldest Python the abi3 wheel claims, so the tests check it.
  TEST_PYTHON: "3.10"

jobs:
  gate:
    # Nothing publishes to PyPI or crates.io unless the tagged commit
    # is on main, the tag names the workspace's version and pod-fw's,
    # and CI passed on that commit (RELEASING.md).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || \
            { echo "$GITHUB_SHA ($GITHUB_REF_NAME) is not on main"; exit 1; }
      - name: Check the tag names the workspace's and pod-fw's version
        shell: python3 {0}
        run: |
          import os
          import sys
          import tomllib

          def load(path):
              with open(path, "rb") as file:
                  return tomllib.load(file)

          tag = os.environ["GITHUB_REF_NAME"]
          versions = {
              "Cargo.toml": load("Cargo.toml")["workspace"]["package"]["version"],
              "firmware/pod-fw/Cargo.toml": load("firmware/pod-fw/Cargo.toml")["package"]["version"],
          }
          wrong = [f"{path} has {version}" for path, version in versions.items() if tag != f"v{version}"]
          if wrong:
              sys.exit(f"tag {tag} is not the version: {'; '.join(wrong)}")
      - name: Check CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The latest run of ci.yml for this commit's push to main, as
          # "status/conclusion"; a re-run of it updates the same run.
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=1" \
            --jq '.workflow_runs[0] | select(.) | "\(.status)/\(.conclusion)"')
          echo "ci on main for $GITHUB_SHA: ${run:-none}"
          test "$run" = completed/success || { echo "ci has not passed on $GITHUB_SHA"; exit 1; }

  package:
    # The published crates packaged and built from their packages
    # alone, in dependency order, as `cargo publish --workspace` uploads
    # them; members with `publish = false` are skipped.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo publish --workspace --dry-run --locked

  wheels:
    # One abi3 wheel per platform: Linux's here, on every run, and
    # macOS's and Windows' in `wheels-macos-windows`, with the same
    # steps.  The compiler is the one rust-toolchain.toml names.
    # Wheels this runner can load run the Python tests, against
    # bdm-stand-in on a Unix socket, which cargo builds from the
    # checkout; cross-built ones (Linux aarch64, macOS x86_64) and
    # Windows', which has no Unix sockets, are only built.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto, test: false }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps: &wheel-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.TEST_PYTHON }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist -m ${{ env.PYTHON_MANIFEST }}
      - name: Test the wheel
        if: matrix.test
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist mc683xx-bdm
          python -m pip install pytest==${{ env.PYTEST_VERSION }}
          python -m pytest -q crates/py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  wheels-macos-windows:
    # `wheels`' steps, for macOS and Windows, on a push to main or a
    # tag only: a pull request builds Linux's wheels alone.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: x86_64, test: false }
          - { os: macos-latest, target: aarch64, test: true }
          - { os: windows-latest, target: x64, test: false }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps: *wheel-steps

  sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist -m ${{ env.PYTHON_MANIFEST }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.TEST_PYTHON }}
      # What pip builds on a platform without a wheel: it must carry the
      # stubs and py.typed, which only the python-source layout puts in
      # the sdist (crates/py/pyproject.toml).
      - name: Build a wheel from the sdist and check its stubs
        shell: bash
        run: |
          python -m pip wheel --no-deps -w "$RUNNER_TEMP/from-sdist" dist/*.tar.gz
          python - "$RUNNER_TEMP"/from-sdist/*.whl <<'EOF'
          import sys
          import zipfile

          names = set(zipfile.ZipFile(sys.argv[1]).namelist())
          missing = sorted({"mc683xx_bdm/__init__.pyi", "mc683xx_bdm/py.typed"} - names)
          if missing:
              sys.exit(f"the sdist's wheel lacks {missing}")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

  pypi:
    # Trusted publishing (OIDC): no token.  It publishes only once PyPI
    # trusts this workflow and the `pypi` environment exists
    # (RELEASING.md), and only from a tag that passed `gate`.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate, wheels, wheels-macos-windows, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mc683xx-bdm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # Skips files PyPI has, so a failed release re-runs.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  crates:
    # crates.io by trusted publishing (OIDC): a short-lived token, none
    # stored.  It publishes only once crates.io trusts this workflow for
    # both crates and the `crates-io` environment exists (RELEASING.md),
    # and only from a tag that passed `gate`.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate, package, pypi]
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/mc683xx-bdm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # Cargo uploads in dependency order; the toolchain is
      # rust-toolchain.toml's.  Crates already published are excluded,
      # as cargo refuses the whole workspace otherwise.
      - run: |
          published=$(sh scripts/published-crates.sh)
          set --
          for name in $published; do
            echo "already on crates.io: $name"
            set -- "$@" --exclude "$name"
          done
          cargo publish --workspace --locked "$@"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # `make uf2` takes elf2uf2-rs here: picotool 2 is not on the runner.
  # The toolchain and its targets are rust-toolchain.toml's.
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ELF2UF2_RS_VERSION: "2.2.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add thumbv6m-none-eabi
      - name: Cache elf2uf2-rs
        id: cache-elf2uf2-rs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/elf2uf2-rs
          key: elf2uf2-rs-${{ runner.os }}-${{ runner.arch }}-${{ env.ELF2UF2_RS_VERSION }}
      # Its deploy option links libudev.
      - name: Install elf2uf2-rs
        if: steps.cache-elf2uf2-rs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
          cargo install --locked elf2uf2-rs --version "$ELF2UF2_RS_VERSION"
      - name: UF2
        run: make uf2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pod-fw-uf2
          path: firmware/pod-fw/target/pod-fw-rp2040.uf2
          if-no-files-found: error
          retention-days: 30

  # The UF2 goes where crates/host's [package.metadata.deb] takes it
  # from.  No build-deps: nusb needs no libudev.  No toolchain input:
  # rust-build-deb reads rust-toolchain.toml.  rust-build-deb releases
  # a tag and takes no dependency of its own, so a tag's run starts it
  # only once `gate` has passed: a tag that fails `gate` publishes
  # nothing.  `gate` is skipped off a tag, which would skip this job
  # too, hence the condition spelled out.
  deb:
    needs: [firmware, gate]
    if: >-
      !cancelled()
      && needs.firmware.result == 'success'
      && (needs.gate.result == 'success' || !startsWith(github.ref, 'refs/tags/v'))
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    permissions:
      contents: write
    with:
      packages: "mc683xx-bdm"
      prebuilt-artifact: pod-fw-uf2
      prebuilt-path: firmware/pod-fw/target

  # The UF2 on the release the deb job created, for flashing a pod
  # without the package.
  uf2:
    needs: deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pod-fw-uf2
      - name: Attach the UF2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" pod-fw-rp2040.uf2 -R "$GITHUB_REPOSITORY"
