# The hardware tools' environment: jlcpcb-release, kicad-style-check and
# stitch from the ee_tooling submodule, and fastcheck.py, this board's
# fast-net report.
[project]
name = "m683xx-pod-hardware"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ee-tooling",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv.sources]
ee-tooling = { path = "ee_tooling", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ee_tooling"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
