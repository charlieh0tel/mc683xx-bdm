[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "mc683xx-bdm"
description = "The mc683xx CPU32 BDM pod, for Python scripts"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
# A copy of the root's, so the wheel and sdist carry it (RELEASING.md).
license-files = ["LICENSE"]
authors = [{ name = "Christopher Hoover", email = "ch@murgatroid.com" }]
keywords = ["bdm", "cpu32", "m68k", "mc68331", "debugger"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]
# The workspace's version (Cargo.toml), one for the crates and the
# wheel (RELEASING.md).
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/charlieh0tel/mc683xx-bdm"
Changelog = "https://github.com/charlieh0tel/mc683xx-bdm/releases"
Documentation = "https://github.com/charlieh0tel/mc683xx-bdm/blob/main/crates/py/README.md"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "typing-extensions>=4.16.0",
]

[tool.maturin]
# The package is python/mc683xx_bdm: the stubs, `py.typed` and an
# `__init__.py` that takes the compiled module's names, which maturin
# puts beside them as `mc683xx_bdm.mc683xx_bdm`; as cpu32-py's.
python-source = "python"
module-name = "mc683xx_bdm.mc683xx_bdm"
# `python` builds the bindings (Cargo.toml); abi3 makes one module for
# every Python from 3.12.
features = ["python", "pyo3/extension-module", "pyo3/abi3-py312"]

[tool.uv]
# uv rebuilds the module when the Rust it is built from changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../../Cargo.lock" },
    { file = "../host/Cargo.toml" },
    { file = "../host/src/**/*.rs" },
    { file = "../proto/Cargo.toml" },
    { file = "../proto/src/**/*.rs" },
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mc683xx_bdm", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
