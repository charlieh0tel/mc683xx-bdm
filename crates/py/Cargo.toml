[package]
name = "mc683xx-bdm-py"
description = "Python bindings for the mc683xx CPU32 BDM pod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Released as the PyPI package `mc683xx-bdm`, not to crates.io
# (RELEASING.md).
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

# The bindings build only with `python`, which maturin enables
# (pyproject.toml); without it the crate is its Python-free parts, so
# `cargo test` needs no Python (PLAN.md, Host).
[features]
python = ["dep:pyo3"]

[dependencies]
mc683xx-bdm.workspace = true
mc683xx-bdm-proto.workspace = true
mc683xx-target = "0.6.0"
pyo3 = { version = "0.30.1", optional = true }
thiserror = "2.0.21"
