[package]
name = "mc683xx-bdm"
description = "The host side of the mc683xx BDM pod, a USB debugger for CPU32 (683xx) microcontrollers: a library and the `bdm` command line, with a gdb server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["embedded", "hardware-support", "development-tools::debugging", "command-line-utilities"]
# The library, `bdm`, the build script and what it includes, the README
# and the license text: the tests need the path-only
# mc683xx-bdm-model, which a package drops (RELEASING.md).
include = ["/src", "/build.rs", "/git-version.rs", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
embassy-futures = "0.1.2"
mc683xx-bdm-proto.workspace = true
mc683xx-gdb = { version = "0.8.0", default-features = false }
mc683xx-target = "0.8.0"
nusb = "0.2.9"
signal-hook = "0.4.6"
thiserror = "2.0.21"

# The model is the tests' target only: path-only, so a package drops it.
[dev-dependencies]
mc683xx-bdm-model.workspace = true

[lints]
workspace = true

[[bin]]
name = "bdm"
path = "src/main.rs"

# The Debian package: `make deb`.  Only `bdm` ships.
[package.metadata.deb]
name = "mc683xx-bdm"
maintainer = "Christopher Hoover <ch@murgatroid.com>"
copyright = "2026, Christopher Hoover"
extended-description = """\
bdm, the host command line for the mc683xx pod, a USB background debug \
mode (BDM) pod for Motorola/Freescale CPU32 (683xx) microcontrollers \
built on a Raspberry Pi Pico.  It halts, resets and runs the target and \
reads and writes its registers and memory, and serves gdb's remote \
protocol (bdm gdb).  Includes the pod's udev \
rule, which gives it to the user at the seat and to group plugdev, and \
the pod's firmware as a UF2."""
section = "electronics"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/bdm", "usr/bin/", "755"],
    ["../../packaging/udev/70-mc683xx-pod.rules", "usr/lib/udev/rules.d/70-mc683xx-pod.rules", "644"],
    ["../../README.md", "usr/share/doc/mc683xx-bdm/README.md", "644"],
    ["../../firmware/pod-fw/target/pod-fw-rp2040.uf2", "usr/share/mc683xx-bdm/", "644"],
]
changelog = "../../packaging/debian/changelog"
