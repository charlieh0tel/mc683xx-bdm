# Its own workspace, so cargo never climbs to an enclosing one (a
# worktree nested in another checkout).
[workspace]

[package]
name = "pod-fw"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
cortex-m = { version = "0.7.10", features = ["inline-asm"] }
# paint-stack: the stack filled with 0xCCCCCCCC at reset, for stack-peak.
cortex-m-rt = { version = "0.7.7", features = ["paint-stack"] }
defmt = { version = "1.2.0", optional = true }
defmt-rtt = { version = "1.3.1", optional = true }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = ["time-driver", "critical-section-impl", "unstable-pac"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
fixed = "1.31.0"
mc683xx-bdm-proto = { version = "0.1.0", path = "../../crates/proto" }
mc683xx-target = "0.6.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"], optional = true }
# embassy-rp 0.10 loads pio 0.3 programs.
pio = "0.3.0"
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
static_cell = "2.1.1"

[features]
default = ["rp2040", "rtt"]
# The chip; choose exactly one, with its target (.cargo/config.toml):
# rp2040 for the Pico (thumbv6m-none-eabi), rp235xa for the Pico 2
# (thumbv8m.main-none-eabihf).
rp2040 = ["embassy-rp/rp2040"]
rp235xa = ["embassy-rp/rp235xa"]
# Events and panics over RTT for an SWD probe (defmt).  Without it the
# firmware logs nothing and, on a panic, turns U1 off and halts for the
# watchdog (src/panic.rs): the production build,
# `--no-default-features -F rp2040` (or rp235xa).
rtt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:panic-probe",
    "embassy-executor/defmt",
    "embassy-rp/defmt",
    "embassy-time/defmt",
    "embassy-usb/defmt",
]

# The host workspace's lints (../../Cargo.toml; ../../clippy.toml holds
# for both): this crate is its own workspace.
[lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "deny"

[lints.clippy]
doc_markdown = "warn"
enum_glob_use = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
large_const_arrays = "deny"

# Optimize for size.  Debug info stays on the host.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"

[profile.dev]
opt-level = "s"
