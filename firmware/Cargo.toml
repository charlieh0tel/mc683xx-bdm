# The crates that build on a host.  pod-fw builds for the Pico
# (thumbv6m-none-eabi or thumbv8m.main-none-eabihf, PLAN.md), so it
# stays out with its own lockfile; it takes the shared crates by path.
[workspace]
members = ["bdm-model", "pod-host", "pod-proto", "pod-py"]
exclude = ["pod-fw"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
doc_markdown = "warn"
enum_glob_use = "deny"
# Nothing large on the stack (clippy.toml's thresholds).
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
large_const_arrays = "deny"
