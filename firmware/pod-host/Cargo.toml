[package]
name = "pod-host"
version = "0.1.0"
description = "Host command line for the mc683xx CPU32 BDM pod"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
bdm-model = { version = "0.1.0", path = "../bdm-model" }
clap = { version = "4.6.7", features = ["derive"] }
embassy-futures = "0.1.2"
mc683xx-target = { git = "https://github.com/charlieh0tel/mc683xx", rev = "5dec517bdfc4456228fa2681fc1d1229172a1aae", version = "0.2.0" }
nusb = "0.2.9"
pod-proto = { version = "0.1.0", path = "../pod-proto" }
thiserror = "2.0.21"

[lints]
workspace = true

[[bin]]
name = "bdm"
path = "src/main.rs"

# The Debian package: `make deb`.  Only `bdm` ships; `bdm-stand-in` is a
# test aid.
[package.metadata.deb]
name = "mc683xx-bdm"
maintainer = "Christopher Hoover <ch@murgatroid.com>"
copyright = "2026, Christopher Hoover"
extended-description = """\
bdm, the host command line for the mc683xx pod, a USB background debug \
mode (BDM) pod for Motorola/Freescale CPU32 (683xx) microcontrollers \
built on a Raspberry Pi Pico.  It halts, resets and runs the target and \
reads and writes its registers and memory.  Includes the pod's udev \
rule, which gives it to the user at the seat and to group plugdev, and \
the pod's firmware as a UF2."""
section = "electronics"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/bdm", "usr/bin/", "755"],
    ["../../packaging/udev/70-mc683xx-pod.rules", "usr/lib/udev/rules.d/70-mc683xx-pod.rules", "644"],
    ["../../README.md", "usr/share/doc/mc683xx-bdm/README.md", "644"],
    ["../pod-fw/target/pod-fw-rp2040.uf2", "usr/share/mc683xx-bdm/", "644"],
]
changelog = "../../packaging/debian/changelog"
